name: test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
          sudo ln -sf "$(command -v lua5.2)" /usr/local/bin/lua
      - name: Run tests
        run: npm test
